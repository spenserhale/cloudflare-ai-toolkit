name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (generate dist + .d.ts for cross-package type resolution)
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Smoke test built CLI
        run: node packages/cli/dist/bin.js --help

      # Capture version + pending-changeset state from the PRISTINE checkout,
      # BEFORE the changesets action runs `changeset version` in the working
      # tree when it (re)builds the version PR branch. After the action, the
      # tree may show a bumped version and consumed changesets even on runs
      # that only opened/updated the version PR — releasing from that state
      # would cut the tag from the wrong commit.
      - name: Capture release state
        id: state
        run: |
          version=$(node -e "console.log(require('./packages/cli/package.json').version)")
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$pending" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm publish may fail (expired/invalid NPM_TOKEN). The standalone
        # binary distribution must not depend on npm: keep going and cut the
        # GitHub Release from the merged version bump regardless.
        continue-on-error: true

      - name: Warn when npm publish failed
        if: steps.changesets.outcome == 'failure'
        run: |
          echo "::warning::npm publish failed (check NPM_TOKEN). The GitHub Release and binaries are still being published so the curl install keeps working."

      - name: Create GitHub Release for new versions
        # Runs on version-PR merges (pristine tree: no pending changesets,
        # version bump present) whether or not npm publish succeeded — the
        # binary install path is npm-free. Skips when the release already
        # exists (e.g. docs-only pushes after a release).
        if: always() && !cancelled() && steps.state.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.state.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes "Release $tag. Binary assets will be attached by the Binaries workflow."
          # Releases created via GITHUB_TOKEN don't fire `release: published`
          # downstream workflows, so dispatch Binaries explicitly.
          gh workflow run binaries.yml -f tag="$tag"
